services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doanvien-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    volumes:
      - ./wwwroot/uploads:/app/wwwroot/uploads
    networks:
      - doanvien-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doanvien-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_INTERNAL_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - doanvien-network

networks:
  doanvien-network:
    driver: bridge
